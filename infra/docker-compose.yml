services:
  postgres:
    image: postgres:17
    container_name: pms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pms_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD-dev_only_owner_pw}
      POSTGRES_DB: pms
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pms_owner -d pms"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pms_pgdata:
